[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-drawio"
dynamic = ["version"]
description = "NetBox plugin for creating draw.io diagrams and assigning them to multiple NetBox objects"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Jan Krupa", email = "jan.krupa@cesnet.cz"},
]
keywords = ["netbox", "netbox-plugin", "drawio", "diagrams"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Operating System :: OS Independent",
]

# No runtime dependencies: the plugin only runs inside NetBox, which pins Django.
dependencies = []

[project.urls]
Homepage = "https://github.com/CESNET/netbox_drawio"
Repository = "https://github.com/CESNET/netbox_drawio"
Issues = "https://github.com/CESNET/netbox_drawio/issues"
Changelog = "https://github.com/CESNET/netbox_drawio/blob/main/CHANGELOG.md"

[project.entry-points."netbox.plugins"]
netbox_drawio = "netbox_drawio:config"

[tool.setuptools.dynamic]
version = {attr = "netbox_drawio.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_drawio*"]

[tool.setuptools.package-data]
netbox_drawio = ["**/*"]

[tool.setuptools.exclude-package-data]
netbox_drawio = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.extend-per-file-ignores]
"netbox_drawio/tables.py" = ["E501"]
"netbox_drawio/migrations/*" = ["E501"]
